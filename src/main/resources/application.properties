spring.application.name=Manna

# ===============================
# MySQL 데이터소스 설정
# ===============================
# DB 연결 URL (서버 시간대, SSL, 공개키 설정 포함)
spring.datasource.url=jdbc:mysql://localhost:3305/manna?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
# DB 사용자명
spring.datasource.username=root
# DB 비밀번호
spring.datasource.password=1234
# MySQL 드라이버 클래스
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA (Hibernate) 설정
# ===============================
# 데이터베이스 종류
spring.jpa.database=mysql
# DDL 자동 처리 방식 (update: 엔티티 변경 시 테이블 자동 반영)
spring.jpa.hibernate.ddl-auto=update
# SQL 쿼리 콘솔 출력 여부
spring.jpa.show-sql=true
# SQL 쿼리 보기 좋게 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# View 렌더링 중 DB 쿼리 방지
spring.jpa.open-in-view=false